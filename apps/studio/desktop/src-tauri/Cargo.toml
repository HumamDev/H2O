[package]
name = "h2o-studio-desktop"
default-run = "h2o-studio-desktop"
version = "0.1.0"
description = "H2O Studio — Tauri V2 desktop shell (M1 boot proof)."
edition = "2021"
rust-version = "1.77"
authors = ["H2O / Cockpit Pro"]
license = "UNLICENSED"

[lib]
name = "h2o_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys = "0.30.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls"] }
# F5H.3b.1a — deterministic SHA-256 for the synthetic-cleanup previewToken.
# Already pinned transitively via the sqlx/digest chain; promoting to a
# direct dep so synthetic_cleanup_dryrun.rs can `use sha2::*` cleanly.
sha2 = "0.10"
# Archive durable write — macOS `F_FULLFSYNC` (plain fsync(2) does not flush
# the drive cache on Darwin) and percent-decoding of the destination header,
# mirroring `plugin:fs|write_file`'s marshaling. Both are already pinned
# transitively via the tauri/libsqlite3-sys chain; promoting them to direct
# deps so archive_durable_write.rs can `use` them cleanly.
libc = "0.2"
percent-encoding = "2"
# M06 T1.5: strict RFC 3339 parsing for the trusted savedAt ordering key.
# `time` is ALREADY in this crate's dependency graph (transitively, at the same
# 0.3 line), so naming it directly adds no new crate to the build; only the
# `parsing` feature is requested. Preferred over hand-rolling calendar
# arithmetic inside a security-sensitive ordering primitive.
time = { version = "0.3", features = ["parsing"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
# Test-only: lets T1.2.2 EXECUTE the pinned glob matcher semantics that §R.1
# depends on, instead of asserting on source text. Same version tauri already
# resolves, so the production dependency graph is unchanged.
glob = "0.3"
